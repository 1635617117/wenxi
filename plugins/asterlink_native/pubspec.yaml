name: asterlink_native
description: >-
  iOS host bridge for AsterLink: exposes the com.asterlink.app/native channel
  (paths + Gopeed RPC) and links the gomobile-built Gopeed xcframework.
  No Android/Windows implementation is declared, so non-iOS builds skip it.
publish_to: none
version: 1.5.0

environment:
  sdk: '>=3.11.0 <4.0.0'

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AsterlinkNativePlugin

dependencies:
  flutter:
    sdk: flutter
