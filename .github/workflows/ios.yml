name: Build iOS ipa (unsigned)

# Everything runs on a GitHub-hosted macOS runner: Xcode, iOS SDK and the
# clang toolchain gomobile needs are preinstalled, so no physical Mac is
# required anywhere in this pipeline. The artifact is unsigned, which is
# exactly what a jailbroken phone consumes (TrollStore / Sideloadly /
# AltStore); no Apple developer account or paid certificate is involved.
#
# Trigger: push a tag or click "Run workflow" (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: auto

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # gomobile init pulls gobind@latest, which requires go >= 1.26.
          go-version: '1.26'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project's own setup action uses (.github/
          # actions/setup). Newer stable releases apply stricter Dart null
          # promotion rules and reject upstream sources such as
          # lib/download/download_manager.dart.
          flutter-version: '3.41.4'
          cache: true

      # 1. Build the Go engine into an xcframework and drop it where the local
      #    plugin's podspec looks for it (vendored_frameworks).
      - name: Build Gopeed engine for iOS
        run: bash native/build-gopeed-ios.sh

      # gomobile ships the framework without a module.modulemap, so Swift's
      # `import AsterLink` sees no ObjC classes at all. Add one per slice.
      - name: Inject modulemap
        run: |
          FW=plugins/asterlink_native/ios/AsterLink.xcframework
          for SLICE in "$FW"/*/AsterLink.framework; do
            # Placed at the framework root so umbrella paths resolve against it
            # (a Modules/ subdir would need ../Headers/...).
            cat > "$SLICE/module.modulemap" <<'EOF'
          module AsterLink {
            umbrella header "Headers/AsterLink.h"
            export *
            module * { export * }
          }
          EOF
            echo "modulemap -> $SLICE/module.modulemap"
            cat "$SLICE/module.modulemap"
          done

      # Diagnostics: exact ObjC class/method names for the Swift bridge.
      - name: Dump xcframework headers
        run: |
          FW=plugins/asterlink_native/ios/AsterLink.xcframework
          echo "--- Gopeed.objc.h (ios-arm64) ---"
          sed -n '1,80p' "$FW/ios-arm64/AsterLink.framework/Headers/Gopeed.objc.h" || true
          echo "--- AsterLink.h ---"
          cat "$FW/ios-arm64/AsterLink.framework/Headers/AsterLink.h" || true

      # 2. Generate the iOS runner project (never committed; template-owned).
      - name: Create iOS project
        run: flutter create --platforms=ios .

      # 3. Inject desktop-plugin stubs + Info.plist permissions.
      - name: Prepare iOS build
        run: ruby tool/ios_prepare.rb

      - name: Resolve dependencies
        run: flutter pub get

      # 4. CocoaPods links AsterLink.xcframework via the plugin's podspec.
      - name: Install pods
        run: |
          cd ios
          pod install || (pod repo update && pod install)

      # 5. Unsigned release build. `flutter build ios/ipa` aborts after a
      #    successful Xcode build with "requires a selected Development Team",
      #    even with --no-codesign. Drive xcodebuild directly with signing
      #    disabled and package the ipa ourselves.
      - name: Build unsigned ipa
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/ios/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tail -25
          APP=$(find build/ios/xcode -name "Runner.app" -maxdepth 6 | head -1)
          [ -n "$APP" ] || { echo "Runner.app not found"; exit 1; }
          rm -rf Payload && mkdir -p Payload build/ios/ipa
          cp -R "$APP" Payload/
          zip -qry build/ios/ipa/asterlink-unsigned.ipa Payload
          rm -rf Payload
          ls -la build/ios/ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: asterlink-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
