name: window_manager
description: >-
  Pure-Dart no-op stub of window_manager, used only as a dependency_override
  for iOS/Android builds where the real desktop plugin has no platform
  implementation. Desktop (Windows/macOS/Linux) builds keep the real package.
version: 0.5.2
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
